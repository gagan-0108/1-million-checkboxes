services:
  app:
    build: .
    ports:
      - "${PORT:-7000}:${PORT:-7000}"
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
    depends_on:
      valkey:
        condition: service_started
    restart: unless-stopped

  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    restart: unless-stopped

volumes:
  valkey_data: